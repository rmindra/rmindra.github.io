<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0083B0" />
      <stop offset="100%" stop-color="#00B4DB" />
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4DB" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Outer Window/Canvas -->
  <rect width="800" height="450" fill="url(#bg)" rx="12" />
  
  <!-- Top Bar (Mac style window wrapper to make it feel premium) -->
  <rect x="0" y="0" width="800" height="40" fill="#E2E8F0" rx="12" />
  <rect x="0" y="28" width="800" height="12" fill="#E2E8F0" />
  <circle cx="24" cy="20" r="5.5" fill="#EF4444" />
  <circle cx="42" cy="20" r="5.5" fill="#EAB308" />
  <circle cx="60" cy="20" r="5.5" fill="#22C55E" />
  <rect x="250" y="11" width="300" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.8" />
  <text x="400" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">rmindra.github.io/booklist-dom/</text>

  <!-- Main Content Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="55" width="720" height="375" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- Header Logo: Open Book + MyBookList -->
  <g transform="translate(290, 75)">
    <!-- Book Left Page -->
    <path d="M 0 5 Q 12 2 24 5 L 24 35 Q 12 32 0 35 Z" fill="url(#bookLeft)" />
    <!-- Book Right Page -->
    <path d="M 27 5 Q 39 2 51 5 L 51 35 Q 39 32 27 35 Z" fill="url(#bookRight)" />
    <rect x="24" y="5" width="3" height="30" fill="#006385" opacity="0.3" />
    
    <!-- Title Text -->
    <text x="62" y="31" font-family="'Outfit', sans-serif" font-size="28" font-weight="300" fill="#334155">My<tspan font-weight="600" fill="#00A8CC">Book</tspan><tspan font-weight="300" fill="#334155">List</tspan></text>
  </g>

  <!-- Alert Banner: Book Added -->
  <rect x="70" y="125" width="660" height="34" rx="4" fill="#D1E7DD" stroke="#BADBCC" stroke-width="1" />
  <text x="85" y="147" fill="#0F5132" font-family="'Inter', sans-serif" font-size="13">Book Added</text>

  <!-- Form Section -->
  <!-- Title Label & Input -->
  <text x="70" y="178" fill="#475569" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Title</text>
  <rect x="70" y="185" width="660" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

  <!-- Author Label & Input -->
  <text x="70" y="233" fill="#475569" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Author</text>
  <rect x="70" y="240" width="660" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

  <!-- ISBN# Label & Input (Focused/Active) -->
  <text x="70" y="288" fill="#475569" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ISBN#</text>
  <rect x="70" y="295" width="660" height="30" rx="4" fill="#FFFFFF" stroke="#00A8CC" stroke-width="2" />

  <!-- Add Book Button -->
  <rect x="70" y="338" width="660" height="34" rx="4" fill="#0099B8" />
  <text x="400" y="360" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Add Book</text>

  <!-- Book Table Header -->
  <rect x="70" y="385" width="660" height="24" fill="#FFFFFF" />
  <text x="80" y="401" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Title</text>
  <text x="240" y="401" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Author</text>
  <text x="400" y="401" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">ISBN#</text>

  <!-- Table Row 1 (Bumi | Tere Liye | 9786239726263 | X) -->
  <rect x="70" y="410" width="660" height="30" fill="#F8FAFC" />
  <text x="80" y="430" fill="#334155" font-family="'Inter', sans-serif" font-size="12">Bumi</text>
  <text x="240" y="430" fill="#334155" font-family="'Inter', sans-serif" font-size="12">Tere Liye</text>
  <text x="400" y="430" fill="#334155" font-family="'Inter', sans-serif" font-size="12">9786239726263</text>
  
  <!-- Delete X Button -->
  <rect x="685" y="415" width="22" height="20" rx="3" fill="#EF4444" />
  <text x="696" y="429" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">X</text>
</svg>
