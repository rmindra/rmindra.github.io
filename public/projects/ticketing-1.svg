<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#18181D" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131317" />
      <stop offset="100%" stop-color="#1A1A20" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)" rx="12" />
  
  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#131317" rx="12" />
  <rect x="0" y="36" width="800" height="12" fill="#131317" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="24" r="6" fill="#EAB308" opacity="0.8" />
  <circle cx="68" cy="24" r="6" fill="#22C55E" opacity="0.8" />
  <text x="400" y="28" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">ticketing-in // IT Support Ticketing &amp; Helpdesk Portal (PHP / MySQL)</text>

  <!-- Main Portal Card -->
  <rect x="50" y="75" width="700" height="340" rx="10" fill="url(#card)" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Header -->
  <text x="80" y="115" fill="#FAFAFA" font-family="'Outfit', sans-serif" font-weight="700" font-size="20">IT Operations Helpdesk Dashboard</text>
  <text x="80" y="137" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="13">PHP MVC Portal • Active Ticket Priority Escalation Matrix</text>

  <!-- Stats Cards -->
  <rect x="80" y="160" width="195" height="65" rx="8" fill="#18181D" stroke="#333338" />
  <text x="95" y="185" fill="#71717A" font-family="'Inter', sans-serif" font-size="12">Open Tickets</text>
  <text x="95" y="212" fill="#3B82F6" font-family="'Outfit', sans-serif" font-weight="700" font-size="22">14 Active</text>

  <rect x="295" y="160" width="195" height="65" rx="8" fill="#18181D" stroke="#333338" />
  <text x="310" y="185" fill="#71717A" font-family="'Inter', sans-serif" font-size="12">In Progress</text>
  <text x="310" y="212" fill="#EAB308" font-family="'Outfit', sans-serif" font-weight="700" font-size="22">5 Assigned</text>

  <rect x="510" y="160" width="210" height="65" rx="8" fill="#18181D" stroke="#333338" />
  <text x="525" y="185" fill="#71717A" font-family="'Inter', sans-serif" font-size="12">Resolved (24h)</text>
  <text x="525" y="212" fill="#22C55E" font-family="'Outfit', sans-serif" font-weight="700" font-size="22">28 Closed</text>

  <!-- Ticket Table -->
  <rect x="80" y="245" width="640" height="145" rx="8" fill="#18181D" stroke="#333338" />
  
  <!-- Row 1 -->
  <rect x="95" y="260" width="610" height="34" rx="6" fill="#131317" />
  <text x="110" y="282" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">#TCK-892</text>
  <text x="200" y="282" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="13">Network Switch Failure in Auditorium EEPIS</text>
  <rect x="610" y="267" width="80" height="20" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8" />
  <text x="650" y="281" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">HIGH</text>

  <!-- Row 2 -->
  <rect x="95" y="302" width="610" height="34" rx="6" fill="#131317" />
  <text x="110" y="324" fill="#EAB308" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">#TCK-891</text>
  <text x="200" y="324" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="13">Printer Driver Setup on Staff Workstation C-202</text>
  <rect x="610" y="309" width="80" height="20" rx="4" fill="#EAB308" fill-opacity="0.2" stroke="#EAB308" stroke-width="0.8" />
  <text x="650" y="323" fill="#EAB308" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MEDIUM</text>

  <!-- Row 3 -->
  <rect x="95" y="344" width="610" height="34" rx="6" fill="#131317" />
  <text x="110" y="366" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">#TCK-890</text>
  <text x="200" y="366" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="13">Account Permission Request for New Intern</text>
  <rect x="610" y="351" width="80" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="0.8" />
  <text x="650" y="365" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">LOW</text>
</svg>
