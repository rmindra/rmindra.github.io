<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#18181D" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131317" />
      <stop offset="100%" stop-color="#1A1A20" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)" rx="12" />
  
  <!-- Grid background -->
  <g fill="#27272A" opacity="0.35">
    <circle cx="40" cy="40" r="1.5" /><circle cx="40" cy="100" r="1.5" /><circle cx="40" cy="160" r="1.5" /><circle cx="40" cy="220" r="1.5" /><circle cx="40" cy="280" r="1.5" /><circle cx="40" cy="340" r="1.5" /><circle cx="40" cy="400" r="1.5" />
    <circle cx="120" cy="40" r="1.5" /><circle cx="120" cy="100" r="1.5" /><circle cx="120" cy="160" r="1.5" /><circle cx="120" cy="220" r="1.5" /><circle cx="120" cy="280" r="1.5" /><circle cx="120" cy="340" r="1.5" /><circle cx="120" cy="400" r="1.5" />
    <circle cx="200" cy="40" r="1.5" /><circle cx="200" cy="100" r="1.5" /><circle cx="200" cy="160" r="1.5" /><circle cx="200" cy="220" r="1.5" /><circle cx="200" cy="280" r="1.5" /><circle cx="200" cy="340" r="1.5" /><circle cx="200" cy="400" r="1.5" />
    <circle cx="280" cy="40" r="1.5" /><circle cx="280" cy="100" r="1.5" /><circle cx="280" cy="160" r="1.5" /><circle cx="280" cy="220" r="1.5" /><circle cx="280" cy="280" r="1.5" /><circle cx="280" cy="340" r="1.5" /><circle cx="280" cy="400" r="1.5" />
    <circle cx="360" cy="40" r="1.5" /><circle cx="360" cy="100" r="1.5" /><circle cx="360" cy="160" r="1.5" /><circle cx="360" cy="220" r="1.5" /><circle cx="360" cy="280" r="1.5" /><circle cx="360" cy="340" r="1.5" /><circle cx="360" cy="400" r="1.5" />
    <circle cx="440" cy="40" r="1.5" /><circle cx="440" cy="100" r="1.5" /><circle cx="440" cy="160" r="1.5" /><circle cx="440" cy="220" r="1.5" /><circle cx="440" cy="280" r="1.5" /><circle cx="440" cy="340" r="1.5" /><circle cx="440" cy="400" r="1.5" />
    <circle cx="520" cy="40" r="1.5" /><circle cx="520" cy="100" r="1.5" /><circle cx="520" cy="160" r="1.5" /><circle cx="520" cy="220" r="1.5" /><circle cx="520" cy="280" r="1.5" /><circle cx="520" cy="340" r="1.5" /><circle cx="520" cy="400" r="1.5" />
    <circle cx="600" cy="40" r="1.5" /><circle cx="600" cy="100" r="1.5" /><circle cx="600" cy="160" r="1.5" /><circle cx="600" cy="220" r="1.5" /><circle cx="600" cy="280" r="1.5" /><circle cx="600" cy="340" r="1.5" /><circle cx="600" cy="400" r="1.5" />
    <circle cx="680" cy="40" r="1.5" /><circle cx="680" cy="100" r="1.5" /><circle cx="680" cy="160" r="1.5" /><circle cx="680" cy="220" r="1.5" /><circle cx="680" cy="280" r="1.5" /><circle cx="680" cy="340" r="1.5" /><circle cx="680" cy="400" r="1.5" />
    <circle cx="760" cy="40" r="1.5" /><circle cx="760" cy="100" r="1.5" /><circle cx="760" cy="160" r="1.5" /><circle cx="760" cy="220" r="1.5" /><circle cx="760" cy="280" r="1.5" /><circle cx="760" cy="340" r="1.5" /><circle cx="760" cy="400" r="1.5" />
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#131317" rx="12" />
  <rect x="0" y="36" width="800" height="12" fill="#131317" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="24" r="6" fill="#EAB308" opacity="0.8" />
  <circle cx="68" cy="24" r="6" fill="#22C55E" opacity="0.8" />
  <text x="400" y="28" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">2026-SPRK-backend // Swagger OpenAPI &amp; REST Endpoints</text>

  <!-- Main Swagger/API Window -->
  <rect x="40" y="70" width="720" height="345" rx="10" fill="url(#card)" stroke="#27272A" stroke-width="1.5" />
  
  <rect x="70" y="95" width="130" height="30" rx="6" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-width="1" />
  <text x="135" y="115" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">.NET 10 API</text>
  <text x="220" y="116" fill="#FAFAFA" font-family="'Outfit', sans-serif" font-weight="700" font-size="20">SPRK Reservation Engine API v1.0</text>
  <text x="640" y="116" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="12">OAS 3.0 • READY</text>

  <!-- Endpoint 1: GET /api/Bookings -->
  <rect x="70" y="150" width="660" height="48" rx="8" fill="#18181D" stroke="#3B82F6" stroke-width="1.2" />
  <rect x="82" y="160" width="64" height="28" rx="6" fill="#3B82F6" />
  <text x="114" y="178" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">GET</text>
  <text x="165" y="179" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14">/api/Bookings</text>
  <text x="330" y="178" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="13">Retrieve filtered booking list (by date, room, status, borrower)</text>

  <!-- Endpoint 2: POST /api/Bookings -->
  <rect x="70" y="210" width="660" height="48" rx="8" fill="#18181D" stroke="#22C55E" stroke-width="1.2" />
  <rect x="82" y="220" width="64" height="28" rx="6" fill="#22C55E" />
  <text x="114" y="238" fill="#0E0E11" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">POST</text>
  <text x="165" y="239" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14">/api/Bookings</text>
  <text x="330" y="238" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="13">Create new room booking with real-time schedule overlap validation</text>

  <!-- Endpoint 3: PATCH /api/Bookings/{id}/status -->
  <rect x="70" y="270" width="660" height="48" rx="8" fill="#18181D" stroke="#EAB308" stroke-width="1.2" />
  <rect x="82" y="280" width="64" height="28" rx="6" fill="#EAB308" />
  <text x="114" y="298" fill="#0E0E11" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">PATCH</text>
  <text x="165" y="299" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14">/api/Bookings/{id}/status</text>
  <text x="390" y="298" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="13">Update status (Pending → Approved / Rejected) with Conflict Guard</text>

  <!-- Endpoint 4: GET /api/Rooms -->
  <rect x="70" y="330" width="660" height="48" rx="8" fill="#18181D" stroke="#3B82F6" stroke-width="1.2" />
  <rect x="82" y="340" width="64" height="28" rx="6" fill="#3B82F6" />
  <text x="114" y="358" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">GET</text>
  <text x="165" y="359" fill="#FAFAFA" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14">/api/Rooms</text>
  <text x="330" y="358" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="13">Fetch available campus rooms, capacity specs, and location metadata</text>
</svg>
