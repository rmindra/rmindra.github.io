  <rect x="0" y="0" width="800" height="48" fill="#131317" rx="12" />
  <rect x="0" y="36" width="800" height="12" fill="#131317" />
  <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="48" cy="24" r="6" fill="#EAB308" opacity="0.8" />
  <circle cx="68" cy="24" r="6" fill="#22C55E" opacity="0.8" />
  <text x="400" y="28" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">2026-SPRK-infrastructure // One-Command Makefile Orchestration &amp; Bridge Network</text>

  <!-- Outer Bridge Network Box -->
  <rect x="35" y="65" width="730" height="365" rx="12" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 6" />
  <rect x="55" y="55" width="195" height="24" rx="4" fill="#131317" stroke="#3B82F6" stroke-width="1" />
  <text x="152" y="71" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" text-anchor="middle">🌐 Docker Network: sprk-net</text>

  <!-- Service 1: Frontend Container -->
  <rect x="60" y="110" width="210" height="285" rx="10" fill="url(#card)" stroke="#3B82F6" stroke-width="1.5" />
  <rect x="80" y="130" width="170" height="30" rx="6" fill="#3B82F6" fill-opacity="0.2" />
  <text x="165" y="150" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="middle">🖥️ sprk-frontend</text>
  <text x="165" y="180" fill="#FAFAFA" font-family="'Outfit', sans-serif" font-weight="600" font-size="15" text-anchor="middle">React + Vite UI</text>
  <text x="165" y="200" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Port: 5173 / 80</text>
  
  <rect x="80" y="225" width="170" height="60" rx="6" fill="#18181D" stroke="#333338" />
  <text x="92" y="245" fill="#EAB308" font-family="'JetBrains Mono', monospace" font-size="11">Vite Proxy &amp; Entrypoint</text>
  <text x="92" y="261" fill="#71717A" font-family="'Inter', sans-serif" font-size="10">/api/* → sprk-backend</text>
  <text x="92" y="277" fill="#71717A" font-family="'Inter', sans-serif" font-size="10">Auto npm install check</text>
  
  <rect x="80" y="300" width="170" height="40" rx="6" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" />
  <text x="165" y="324" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" text-anchor="middle">depends_on: backend</text>

