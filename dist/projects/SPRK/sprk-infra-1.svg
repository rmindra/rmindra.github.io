  <rect x="295" y="110" width="210" height="285" rx="10" fill="url(#card)" stroke="#A855F7" stroke-width="1.5" />
  <rect x="315" y="130" width="170" height="30" rx="6" fill="#A855F7" fill-opacity="0.2" />
  <text x="400" y="150" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="middle">⚡ sprk-backend</text>
  <text x="400" y="180" fill="#FAFAFA" font-family="'Outfit', sans-serif" font-weight="600" font-size="15" text-anchor="middle">ASP.NET Core 10 API</text>
  <text x="400" y="200" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Port: 5006</text>

  <rect x="315" y="225" width="170" height="60" rx="6" fill="#18181D" stroke="#333338" />
  <text x="327" y="248" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="11">Unconditional Migrate</text>
  <text x="327" y="268" fill="#71717A" font-family="'Inter', sans-serif" font-size="11">EF Core 42P04 Guard</text>

  <rect x="315" y="300" width="170" height="40" rx="6" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" />
  <text x="400" y="324" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" text-anchor="middle">condition: healthy</text>

  <!-- Service 3: DB Container -->
  <rect x="530" y="110" width="210" height="285" rx="10" fill="url(#card)" stroke="#22C55E" stroke-width="1.5" />
  <rect x="550" y="130" width="170" height="30" rx="6" fill="#22C55E" fill-opacity="0.2" />
  <text x="635" y="150" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" text-anchor="middle">🗄️ sprk-db</text>
  <text x="635" y="180" fill="#FAFAFA" font-family="'Outfit', sans-serif" font-weight="600" font-size="15" text-anchor="middle">PostgreSQL 16 Alpine</text>
  <text x="635" y="200" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Port: 5432</text>

  <rect x="550" y="225" width="170" height="60" rx="6" fill="#18181D" stroke="#333338" />
  <text x="562" y="248" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="11">Healthcheck Active</text>
  <text x="562" y="268" fill="#71717A" font-family="'Inter', sans-serif" font-size="11">pg_isready -d SPRK</text>

  <rect x="550" y="300" width="170" height="40" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" />
  <text x="635" y="324" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" text-anchor="middle">Vol: sprk_db_data</text>
